<nav class="navbar">
  <a [routerLink]="authService.isAuthenticated() ? '/recettes-publiques' : '/'" class="brand">
    <img src="/logo-cocotte-eclair.jpg" alt="CocotteEclair" class="logo" />
  </a>

  <div class="nav-links">
    @if (authService.isAuthenticated()) {
      <a routerLink="/recettes" routerLinkActive="active">Mes recettes</a>
      <button type="button" class="logout" (click)="logout()">Se déconnecter</button>
    } @else {
      <a routerLink="/connexion" routerLinkActive="active">Connexion</a>
      <a routerLink="/inscription" routerLinkActive="active">Inscription</a>
    }
  </div>
</nav>
