<div class="nouvelle-recette-page">
  <form class="nouvelle-recette-card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h1>Nouvelle recette</h1>

    <label for="titre">Titre</label>
    <input id="titre" type="text" formControlName="titre" autocomplete="off" />

    <label for="description">Description</label>
    <textarea id="description" formControlName="description" rows="4"></textarea>

    <label for="visibilite">Visibilité</label>
    <select id="visibilite" formControlName="visibilite">
      <option value="PRIVEE">Privée</option>
      <option value="PUBLIQUE">Publique</option>
    </select>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Création...' : 'Créer la recette' }}
    </button>

    <a routerLink="/recettes">Annuler</a>
  </form>
</div>
