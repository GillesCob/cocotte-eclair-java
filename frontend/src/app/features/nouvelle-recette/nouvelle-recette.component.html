<div class="form-page nouvelle-recette-page">
  <div class="form-card nouvelle-recette-card">
    <h1>Nouvelle recette</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div>
        <label for="titre">Titre</label>
        <input id="titre" type="text" formControlName="titre" autocomplete="off" />
      </div>

      <div>
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" rows="4"></textarea>
      </div>

      <div>
        <label for="visibilite">Visibilité</label>
        <select id="visibilite" formControlName="visibilite">
          <option value="PRIVEE">Privée</option>
          <option value="PUBLIQUE">Publique</option>
        </select>
      </div>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid || isSubmitting()">
        {{ isSubmitting() ? 'Création...' : 'Créer la recette' }}
      </button>
    </form>

    <p class="bottom-link"><a routerLink="/recettes">Annuler</a></p>
  </div>
</div>
