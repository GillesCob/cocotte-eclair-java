<div class="form-page register-page">
  <div class="form-card register-card">
    <h1>Créer un compte</h1>
    <p class="subtitle">Rejoignez CocotteEclair en quelques secondes</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="votre@email.com" />
      </div>

      <div>
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="••••••••"
        />
      </div>

      @if (errorMessage()) {
        <p class="error" role="alert">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid || isSubmitting()">
        {{ isSubmitting() ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="bottom-link">Déjà un compte ? <a routerLink="/connexion">J'ai déjà un compte</a></p>
  </div>
</div>
