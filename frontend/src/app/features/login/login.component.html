<div class="login-page">
  <div class="login-card">
    <h1>Connexion</h1>
    <p class="subtitle">Accédez à votre espace CocotteEclair</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="votre@email.com" />
      </div>

      <div>
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        <p class="forgot-link"><a routerLink="/forgot-password">Mot de passe oublié ?</a></p>
      </div>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="form.invalid || isSubmitting()">
        {{ isSubmitting() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="bottom-link">Pas encore de compte ? <a routerLink="/inscription">Créer un compte</a></p>
  </div>
</div>
