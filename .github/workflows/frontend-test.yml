name: Frontend build and tests

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Audit de securite des dependances (harnais de tests, point 3) : bloque sur haute/critique.
      - name: Audit des dependances
        continue-on-error: true  # informe sans bloquer tant que la montée majeure d'Angular (21) n'est pas faite ; à remettre bloquant ensuite
        run: npm audit --audit-level=high

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build -- --configuration production
