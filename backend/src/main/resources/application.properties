spring.application.name=CocotteEclairJava

# BDD : H2 en memoire par defaut (dev), ecrase par les variables d'environnement en prod
# (voir application-prod.properties + .env.prod sur le VPS, meme convention que Cerithe/Nexio).
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:cocotteeclair}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

app.jwt.access-secret=${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-32-chars-min}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:dev-only-refresh-secret-change-me-32-chars-min}
app.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
app.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}

app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-address=${RESEND_FROM_ADDRESS:CocotteEclair <onboarding@resend.dev>}
app.reset-password-url=${RESET_PASSWORD_URL:http://localhost:4200/reset-password}

app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Cookie refresh_token en SameSite=Lax (front/back sur le meme domaine enregistrable
# gillescobigo.com, cf RefreshCookieFactory). Secure recommande des que servi en
# HTTPS : false par defaut en dev (http://localhost), COOKIE_SECURE=true a poser
# dans le .env.prod du VPS.
app.cookie.secure=${COOKIE_SECURE:false}

# Rate limiting sur les routes d'auth (par IP), en memoire (VPS mono-instance).
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login.period-minutes=${RATE_LIMIT_LOGIN_PERIOD_MINUTES:1}
app.rate-limit.register.capacity=${RATE_LIMIT_REGISTER_CAPACITY:3}
app.rate-limit.register.period-minutes=${RATE_LIMIT_REGISTER_PERIOD_MINUTES:60}
app.rate-limit.forgot-password.capacity=${RATE_LIMIT_FORGOT_PASSWORD_CAPACITY:3}
app.rate-limit.forgot-password.period-minutes=${RATE_LIMIT_FORGOT_PASSWORD_PERIOD_MINUTES:60}
app.rate-limit.refresh.capacity=${RATE_LIMIT_REFRESH_CAPACITY:20}
app.rate-limit.refresh.period-minutes=${RATE_LIMIT_REFRESH_PERIOD_MINUTES:1}
